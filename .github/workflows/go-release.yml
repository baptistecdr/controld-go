name: Release

on:
  workflow_dispatch:
    inputs:
      version-type:
        description: Version type to release
        required: true
        type: choice
        options:
          - major
          - minor
          - patch
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: Get next version
        uses: reecetech/version-increment@28d33de033e97a304f77238d6a5db26039ca15d6 # 2026.8.4
        id: version
        with:
          scheme: semver
          increment: ${{ github.event.inputs.version-type }}
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: gh release create ${{steps.version.outputs.v-version}} --generate-notes
